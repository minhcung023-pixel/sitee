<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minh Tool</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body { 
            /* Quay lại nền gradient tĩnh, mượt, đéo lag */
            background: linear-gradient(135deg, #09090b 0%, #1a0b2e 50%, #001f3f 100%);
            color: #fff; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 15, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        /* Viền gradient tĩnh */
        .container::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(45deg, #ff007f, #00e5ff);
            z-index: -1;
            border-radius: 21px;
            opacity: 0.5;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(90deg, #00e5ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #00e5ff;
            font-size: 13px;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #ff007f, #7000ff);
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active { transform: scale(0.96); }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00e5ff;
            text-align: left;
            display: none;
        }

        .result-box.error { border-color: #ff007f; color: #ff007f; }
        
        .result-label { font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; font-weight: 700;}
        
        .result-link {
            display: block;
            color: #00e5ff;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            word-break: break-all;
            background: rgba(0, 229, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto 0;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 0, 127, 0.2);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Minh Tool</div>
        <div class="subtitle">Cyber Bypass</div>
        
        <input type="url" id="urlInput" placeholder="Dán link4m vào đây..." autocomplete="off">
        
        <button onclick="bypass()" id="btnBypass">Vượt Ngay</button>
        
        <div class="loading-spinner" id="spinner"></div>
        
        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        async function bypass() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const spinner = document.getElementById('spinner');
            const btn = document.getElementById('btnBypass');
            
            if (!urlInput) {
                resultBox.style.display = 'block';
                resultBox.className = 'result-box error';
                resultBox.innerHTML = 'Nhập link vào bro.';
                return;
            }

            resultBox.style.display = 'none';
            spinner.style.display = 'block';
            btn.style.opacity = '0.5';
            btn.disabled = true;

            try {
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(urlInput);
                const res = await fetch(proxyUrl);
                const html = await res.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const form = doc.querySelector('form#go-link') || doc.querySelector('form');

                if (!form) {
                    const match = html.match(/window\.location\.href\s*=\s*["']([^"']+)/);
                    if (match) return showResult(match[1]);
                    throw new Error("Link4m đổi code hoặc bị chặn.");
                }

                let action = form.getAttribute('action') || urlInput;
                if (action.startsWith('/')) action = 'https://link4m.com' + action;

                const formData = new URLSearchParams();
                form.querySelectorAll('input').forEach(inp => {
                    if (inp.name) formData.append(inp.name, inp.value);
                });

                const postRes = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(action), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                
                const postHtml = await postRes.text();
                
                const matchJs = postHtml.match(/window\.location\.href\s*=\s*["']([^"']+)/);
                if (matchJs) return showResult(matchJs[1]);

                try {
                    const json = JSON.parse(postHtml);
                    if (json.url) return showResult(json.url);
                    if (json.links) return showResult(json.links);
                } catch(e) {}

                const urls = postHtml.match(/https?:\/\/[^\s"'<>]+/g);
                if (urls) {
                    for (let u of urls) {
                        if (!u.includes('link4m') && !u.includes('cloudflare')) {
                            return showResult(u);
                        }
                    }
                }

                throw new Error("Tạch, đéo tìm thấy link.");

            } catch (err) {
                resultBox.style.display = 'block';
                resultBox.className = 'result-box error';
                resultBox.innerHTML = 'Lỗi: ' + err.message;
            } finally {
                spinner.style.display = 'none';
                btn.style.opacity = '1';
                btn.disabled = false;
            }
        }

        function showResult(link) {
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.className = 'result-box';
            resultBox.innerHTML = `
                <div class="result-label">Link gốc đây bro:</div>
                <a href="${link}" class="result-link" target="_blank">${link}</a>
            `;
        }
    </script>
</body>
</html>
